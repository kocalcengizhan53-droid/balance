name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  qa:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Playwright config runs on channel 'chrome', so install Google Chrome rather than Chromium.
      - run: npx playwright install --with-deps chrome
      - run: npm run qa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: qa-output
          path: qa-output/
          retention-days: 14
