name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  qa:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Playwright config runs on channel 'chrome', so install Google Chrome rather than Chromium.
      - run: npx playwright install --with-deps chrome
      - run: npm run qa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: qa-output
          path: qa-output/
          retention-days: 14

  # The quality gate: axe (WCAG 2.2 AA + best practice, zero violations) and Lighthouse's mobile
  # profile (median of three runs per page) against the production build.
  quality:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - name: Serve the production build
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173 > /dev/null && exit 0; sleep 1; done
          cat /tmp/serve.log; exit 1
      - run: npm run qa:axe
      - run: npm run qa:lighthouse
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: qa-output/lighthouse/
          retention-days: 14
